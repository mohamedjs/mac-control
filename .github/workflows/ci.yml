name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libxtst6 libxt6
      - run: npm ci
      - run: npm test
      - name: Doctor under a virtual display
        run: xvfb-run -a node bin/mac-control.js doctor
